Link init.mod
ObjDir �`pwd`�

Filetype ObjectFile
    # Nur einmal für das ganze Verzeichnis ausführen, nicht für
    # jede einzelne Datei
    MatchesOnce .*.o
    Depends .*.c
    Output $destDir/$Link
    Flags

    # Output müßte dann im jeweiligen Unterverzeichnis definiert
    # werden
    Process "$ToolchainPref"ld -o$Output -Ttext=0x40000000 *.o --start-group $Libs --end-group
    #ld -olost.krn -Tkernel.ld header.o !(header).o $2
End ObjectFile
