LibName library.a
ObjDir �`pwd`�

Filetype Library
    # Nur einmal für das ganze Verzeichnis ausführen, nicht für
    # jede einzelne Datei
    MatchesOnce .*.o
    Depends .*.c
    Output $currentDir/$LibName

    # Output müßte dann im jeweiligen Unterverzeichnis definiert
    # werden
    Process "$ToolchainPref"ar rs $Output `ls *.o | sed -e 's/start.o//'`
End ObjectFile
