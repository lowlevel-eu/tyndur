Link lost.krn 
ObjDir �`pwd`�

Filetype ObjectFile
    # Nur einmal für das ganze Verzeichnis ausführen, nicht für
    # jede einzelne Datei
    MatchesOnce .*.o
    Depends .*.c
    Output $destDir/$Link
    Flags

    # Output müßte dann im jeweiligen Unterverzeichnis definiert
    # werden
    Process "$ToolchainPref"ld -o$Output -T$currentDir/kernel.ld $currentDir/header.o  `ls *.o | sed -e 's/header.o//'` $Libs
    #ld -olost.krn -Tkernel.ld header.o !(header).o $2
End ObjectFile
