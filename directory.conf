destDir «$currentDir/build»

ObjDir `pwd`

OtherObjects ""

ToolchainPref «`echo \$COMPILER_PREFIX`»

Includes `test -d $currentDir/include && echo -I $currentDir/include` `test -d $currentDir/../include && echo -I $currentDir/../include` `test -d $currentDir/../../include && echo -I $currentDir/../../include` `test -d $currentDir/../../../include && echo -I $currentDir/../../../include`

Libs `test -f $currentDir/lib/library.a && echo $currentDir/lib/library.a`  `test -f $currentDir/../lib/library.a && echo $currentDir/../lib/library.a`  `test -f $currentDir/../../lib/library.a && echo $currentDir/../../lib/library.a`  `test -f $currentDir/../../../lib/library.a && echo $currentDir/../../../lib/library.a`   `test -f $currentDir/../lib/start.o && echo $currentDir/../lib/start.o`


Filetype C
    # Flags und Output sind benutzerdefinierte Variablen,
    # Matches und Process dagegen "magische"
    # $varname greift auf eine Variable zu, $$ auf den
    # Dateinamen der aktuellen Datei. Backticks für
    # Einbindung von Shell-Kommandos

    Matches .*.c
    Output $ObjDir/`basename "$$" .c`.o
    Depends `gcc -MM $$`
    Flags -g -fno-leading-underscore -fno-omit-frame-pointer -Wall -fno-strict-aliasing -O0  $Includes
    Process "$ToolchainPref"gcc -c $$ -o $Output $Flags

End C


Filetype ASM
    # Flags und Output sind benutzerdefinierte Variablen,
    # Matches und Process dagegen "magische"
    # $varname greift auf eine Variable zu, $$ auf den
    # Dateinamen der aktuellen Datei. Backticks für
    # Einbindung von Shell-Kommandos

    Matches .*.asm
    Output $ObjDir/`basename "$$" .asm`.o
    #Depends `gcc -MM $$`
    Flags -O99 -felf
    Process nasm $Flags -o $Output $$

End ASM

